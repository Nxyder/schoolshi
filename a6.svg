<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position: fixed; top: 0; left: 0;">
  <foreignObject x="0" y="0" width="100%" height="100%">
    <body xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;overflow:hidden;height:100vh;width:100vw;">
      <meta content='width=device-width, initial-scale=1.0' name='viewport'></meta>
      
      <iframe 
        style="position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; padding:0; overflow:auto; z-index:999999;" 
        id="mainFrame"
        srcdoc="
        &lt;!DOCTYPE html&gt;
        &lt;html&gt;
        &lt;head&gt;
          &lt;meta charset=&quot;UTF-8&quot;&gt;
          &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
          &lt;title&gt;Nex Game Platform&lt;/title&gt;
          &lt;script src=&quot;https://cdn.jsdelivr.net/gh/UseNex/nex-js@f60df53fb5554e4e160c086b47bf71f6a213e42c/nex.min.js&quot;&gt;&lt;\/script&gt;
          &lt;style&gt;
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { 
              font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif;
              background: #0a0a0f;
              color: #fff;
              min-height: 100vh;
              overflow-y: auto;
            }
            .header {
              background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
              padding: 30px 20px;
              text-align: center;
              border-bottom: 1px solid #2a2a4e;
              position: sticky;
              top: 0;
              z-index: 100;
            }
            .header h1 {
              font-size: 2.5rem;
              font-weight: 800;
              background: linear-gradient(135deg, #6366f1, #8b5cf6);
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
              margin-bottom: 8px;
            }
            .header p { color: #888; font-size: 1.1rem; }
            .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
            .controls {
              display: flex;
              gap: 10px;
              flex-wrap: wrap;
              margin-bottom: 20px;
              padding: 15px;
              background: #1a1a2e;
              border-radius: 12px;
              border: 1px solid #2a2a4e;
            }
            .controls input {
              flex: 1;
              min-width: 200px;
              padding: 12px 16px;
              background: #0a0a0f;
              border: 1px solid #2a2a4e;
              border-radius: 8px;
              color: #fff;
              font-size: 1rem;
            }
            .controls input:focus { outline: none; border-color: #6366f1; }
            .controls input::placeholder { color: #555; }
            .controls button {
              padding: 12px 24px;
              background: #6366f1;
              color: #fff;
              border: none;
              border-radius: 8px;
              cursor: pointer;
              font-size: 1rem;
              font-weight: 600;
              transition: all 0.3s;
              white-space: nowrap;
            }
            .controls button:hover {
              background: #818cf8;
              transform: translateY(-2px);
              box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            }
            .controls button.secondary {
              background: #1a1a2e;
              border: 1px solid #2a2a4e;
            }
            .controls button.secondary:hover {
              background: #2a2a4e;
              box-shadow: none;
            }
            .game-wrapper {
              background: #1a1a2e;
              border-radius: 12px;
              border: 1px solid #2a2a4e;
              overflow: hidden;
              margin-bottom: 20px;
              position: relative;
              aspect-ratio: 16/9;
              min-height: 400px;
              width: 100%;
            }
            .game-wrapper .loading-overlay {
              position: absolute;
              inset: 0;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              background: #0a0a0f;
              z-index: 10;
              transition: opacity 0.5s;
            }
            .game-wrapper .loading-overlay.hidden {
              opacity: 0;
              pointer-events: none;
            }
            .game-wrapper .spinner {
              width: 50px;
              height: 50px;
              border: 3px solid #2a2a4e;
              border-top-color: #6366f1;
              border-radius: 50%;
              animation: spin 1s linear infinite;
            }
            .game-wrapper .progress-bar {
              margin-top: 20px;
              width: 200px;
              height: 4px;
              background: #2a2a4e;
              border-radius: 2px;
              overflow: hidden;
            }
            .game-wrapper .progress-bar .fill {
              height: 100%;
              background: linear-gradient(90deg, #6366f1, #8b5cf6);
              width: 0%;
              transition: width 0.3s;
            }
            .game-wrapper .loading-text {
              margin-top: 12px;
              color: #888;
              font-size: 0.9rem;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
            nex-game { display: block; width: 100%; height: 100%; }
            .status {
              display: flex;
              align-items: center;
              gap: 10px;
              color: #888;
              font-size: 0.9rem;
              padding: 10px 4px;
              margin-bottom: 20px;
            }
            .status .dot {
              width: 8px;
              height: 8px;
              border-radius: 50%;
              display: inline-block;
            }
            .status .dot.loading { background: #f59e0b; animation: pulse 1.5s infinite; }
            .status .dot.ready { background: #10b981; }
            .status .dot.error { background: #ef4444; }
            @keyframes pulse {
              0%, 100% { opacity: 1; }
              50% { opacity: 0.3; }
            }
            .error-message {
              background: rgba(239, 68, 68, 0.1);
              border: 1px solid rgba(239, 68, 68, 0.3);
              color: #ef4444;
              padding: 12px 16px;
              border-radius: 8px;
              margin-bottom: 16px;
              display: none;
            }
            .error-message.visible { display: block; }
            .gallery-section { margin-top: 30px; padding-bottom: 40px; }
            .gallery-section h2 {
              margin-bottom: 16px;
              font-size: 1.5rem;
              color: #e0e0e0;
            }
            .gallery-grid {
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
              gap: 16px;
            }
            .gallery-card {
              background: #1a1a2e;
              border-radius: 10px;
              overflow: hidden;
              cursor: pointer;
              transition: all 0.3s;
              border: 1px solid transparent;
            }
            .gallery-card:hover {
              transform: translateY(-4px);
              border-color: #6366f1;
              box-shadow: 0 8px 30px rgba(99, 102, 241, 0.15);
            }
            .gallery-card img {
              width: 100%;
              aspect-ratio: 4/3;
              object-fit: cover;
              display: block;
            }
            .gallery-card .info { padding: 10px 12px; }
            .gallery-card .info h3 {
              font-size: 0.9rem;
              font-weight: 600;
              margin-bottom: 2px;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
            }
            .gallery-card .info .category {
              font-size: 0.75rem;
              color: #888;
            }
            ::-webkit-scrollbar {
              width: 10px;
              height: 10px;
            }
            ::-webkit-scrollbar-track {
              background: #0a0a0f;
            }
            ::-webkit-scrollbar-thumb {
              background: #2a2a4e;
              border-radius: 5px;
            }
            ::-webkit-scrollbar-thumb:hover {
              background: #6366f1;
            }
            @media (max-width: 768px) {
              .header h1 { font-size: 1.8rem; }
              .controls input { min-width: 140px; }
              .controls button { padding: 10px 16px; font-size: 0.9rem; }
              .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
              .game-wrapper { aspect-ratio: auto; min-height: 300px; }
            }
            @media (max-width: 480px) {
              .header h1 { font-size: 1.4rem; }
              .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
              .game-wrapper { min-height: 250px; }
            }
          &lt;/style&gt;
        &lt;/head&gt;
        &lt;body&gt;
          &lt;header class=&quot;header&quot;&gt;
            &lt;h1&gt;🎮 Nex Game Platform&lt;/h1&gt;
            &lt;p&gt;Kies een game of zoek naar een specifieke titel&lt;/p&gt;
          &lt;/header&gt;
          
          &lt;div class=&quot;container&quot;&gt;
            &lt;div class=&quot;error-message&quot; id=&quot;errorMessage&quot;&gt;
              ⚠️ &lt;span id=&quot;errorText&quot;&gt;Er is een fout opgetreden&lt;/span&gt;
            &lt;/div&gt;
            
            &lt;div class=&quot;controls&quot;&gt;
              &lt;input type=&quot;text&quot; id=&quot;searchInput&quot; placeholder=&quot;Zoek een game...&quot; oninput=&quot;filterGames(this.value)&quot;&gt;
              &lt;button onclick=&quot;resetGame()&quot;&gt;🔄 Reset&lt;/button&gt;
              &lt;button onclick=&quot;loadRandomGame()&quot; class=&quot;secondary&quot;&gt;🎲 Willekeurig&lt;/button&gt;
            &lt;/div&gt;
            
            &lt;div class=&quot;game-wrapper&quot; id=&quot;gameWrapper&quot;&gt;
              &lt;div class=&quot;loading-overlay&quot; id=&quot;loadingOverlay&quot;&gt;
                &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;
                &lt;div class=&quot;progress-bar&quot;&gt;
                  &lt;div class=&quot;fill&quot; id=&quot;progressFill&quot;&gt;&lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;loading-text&quot; id=&quot;loadingText&quot;&gt;Laden...&lt;/div&gt;
              &lt;/div&gt;
              &lt;nex-game id=&quot;gameContainer&quot; alias=&quot;2048&quot; gid=&quot;main-game&quot;&gt;&lt;/nex-game&gt;
            &lt;/div&gt;
            
            &lt;div class=&quot;status&quot;&gt;
              &lt;span class=&quot;dot loading&quot; id=&quot;statusDot&quot;&gt;&lt;/span&gt;
              &lt;span id=&quot;statusText&quot;&gt;Laden...&lt;/span&gt;
            &lt;/div&gt;
            
            &lt;div class=&quot;gallery-section&quot;&gt;
              &lt;h2&gt;📚 Alle Games&lt;/h2&gt;
              &lt;div class=&quot;gallery-grid&quot; id=&quot;galleryGrid&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          
          &lt;script&gt;
            let currentGid = &quot;main-game&quot;;
            let currentAlias = &quot;2048&quot;;
            
            const gameContainer = document.getElementById(&quot;gameContainer&quot;);
            const loadingOverlay = document.getElementById(&quot;loadingOverlay&quot;);
            const progressFill = document.getElementById(&quot;progressFill&quot;);
            const loadingText = document.getElementById(&quot;loadingText&quot;);
            const statusDot = document.getElementById(&quot;statusDot&quot;);
            const statusText = document.getElementById(&quot;statusText&quot;);
            const errorMessage = document.getElementById(&quot;errorMessage&quot;);
            const errorText = document.getElementById(&quot;errorText&quot;);
            const galleryGrid = document.getElementById(&quot;galleryGrid&quot;);
            const searchInput = document.getElementById(&quot;searchInput&quot;);
            
            function setStatus(state, message) {
              statusDot.className = &quot;dot&quot;;
              if (state === &quot;loading&quot;) {
                statusDot.classList.add(&quot;loading&quot;);
                statusText.textContent = message || &quot;Laden...&quot;;
              } else if (state === &quot;ready&quot;) {
                statusDot.classList.add(&quot;ready&quot;);
                statusText.textContent = message || &quot;Klaar om te spelen!&quot;;
              } else if (state === &quot;error&quot;) {
                statusDot.classList.add(&quot;error&quot;);
                statusText.textContent = message || &quot;Fout&quot;;
              }
            }
            
            function showError(msg) {
              errorText.textContent = msg || &quot;Onbekende fout&quot;;
              errorMessage.classList.add(&quot;visible&quot;);
              setTimeout(() =&gt; errorMessage.classList.remove(&quot;visible&quot;), 5000);
            }
            
            function updateProgress(pct) {
              progressFill.style.width = Math.min(pct, 100) + &quot;%&quot;;
              loadingText.textContent = &quot;Laden... &quot; + Math.round(Math.min(pct, 100)) + &quot;%&quot;;
            }
            
            function loadGame(alias) {
              currentAlias = alias;
              errorMessage.classList.remove(&quot;visible&quot;);
              loadingOverlay.classList.remove(&quot;hidden&quot;);
              updateProgress(0);
              setStatus(&quot;loading&quot;, &quot;Laden...&quot;);
              
              const gid = &quot;game-&quot; + Date.now() + &quot;-&quot; + Math.random().toString(36).substr(2, 6);
              currentGid = gid;
              
              gameContainer.setAttribute(&quot;alias&quot;, alias);
              gameContainer.setAttribute(&quot;gid&quot;, gid);
              
              setTimeout(() =&gt; {
                if (window.nex &amp;&amp; window.nex[gid]) {
                  const game = window.nex[gid];
                  game.on(&quot;progress&quot;, (data) =&gt; updateProgress(data.progress || 0));
                  game.on(&quot;ready&quot;, () =&gt; {
                    updateProgress(100);
                    loadingText.textContent = &quot;Klaar! 🎮&quot;;
                    setStatus(&quot;ready&quot;, &quot;\&quot;&quot; + alias + &quot;\&quot; is klaar!&quot;);
                    setTimeout(() =&gt; {
                      loadingOverlay.classList.add(&quot;hidden&quot;);
                      game.start();
                    }, 400);
                  });
                  game.on(&quot;error&quot;, (err) =&gt; {
                    loadingOverlay.classList.add(&quot;hidden&quot;);
                    setStatus(&quot;error&quot;, &quot;Fout bij laden&quot;);
                    showError(&quot;Kan \&quot;&quot; + alias + &quot;\&quot; niet laden: &quot; + (err.message || &quot;Onbekende fout&quot;));
                  });
                } else {
                  setTimeout(() =&gt; {
                    loadingOverlay.classList.add(&quot;hidden&quot;);
                    setStatus(&quot;ready&quot;, &quot;\&quot;&quot; + alias + &quot;\&quot; geladen&quot;);
                  }, 2000);
                }
              }, 100);
            }
            
            function resetGame() {
              loadGame(currentAlias);
            }
            
            function loadRandomGame() {
              if (window.nex &amp;&amp; window.nex.metadata) {
                const aliases = window.nex.metadata.getAllAliases();
                if (aliases.length &gt; 0) {
                  const random = aliases[Math.floor(Math.random() * aliases.length)];
                  loadGame(random);
                  searchInput.value = &quot;&quot;;
                  filterGames(&quot;&quot;);
                }
              }
            }
            
            function filterGames(query) {
              const cards = galleryGrid.querySelectorAll(&quot;.gallery-card&quot;);
              const q = query.toLowerCase().trim();
              cards.forEach(card =&gt; {
                const alias = card.dataset.alias.toLowerCase();
                const name = card.dataset.name.toLowerCase();
                const match = !q || alias.includes(q) || name.includes(q);
                card.style.display = match ? &quot;&quot; : &quot;none&quot;;
              });
            }
            
            function buildGallery() {
              if (!window.nex || !window.nex.metadata) {
                setTimeout(buildGallery, 500);
                return;
              }
              
              const allGames = window.nex.metadata.getAllMetadata();
              galleryGrid.innerHTML = &quot;&quot;;
              
              Object.values(allGames).forEach(game =&gt; {
                const card = document.createElement(&quot;div&quot;);
                card.className = &quot;gallery-card&quot;;
                card.dataset.alias = game.alias;
                card.dataset.name = game.name;
                card.innerHTML = `
                  &lt;img src=&quot;${game.img}&quot; alt=&quot;${game.name}&quot; loading=&quot;lazy&quot; onerror=&quot;this.src=&apos;data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22&gt;&lt;rect fill=%22%231a1a2e%22 width=%22400%22 height=%22300%22/&gt;&lt;text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2230%22&gt;🎮&lt;/text&gt;&lt;/svg&gt;&apos;&quot;&gt;
                  &lt;div class=&quot;info&quot;&gt;
                    &lt;h3&gt;${game.name}&lt;/h3&gt;
                    &lt;div class=&quot;category&quot;&gt;${game.category || &quot;Game&quot;}&lt;/div&gt;
                  &lt;/div&gt;
                `;
                card.onclick = () =&gt; {
                  loadGame(game.alias);
                  searchInput.value = &quot;&quot;;
                  filterGames(&quot;&quot;);
                };
                galleryGrid.appendChild(card);
              });
            }
            
            document.addEventListener(&quot;DOMContentLoaded&quot;, function() {
              buildGallery();
              setTimeout(() =&gt; loadGame(&quot;2048&quot;), 300);
            });
            
            if (window.nex) {
              window.nex.ready = window.nex.ready || function() {};
              const origReady = window.nex.ready;
              window.nex.ready = function() {
                origReady();
                buildGallery();
              };
            }
            
            console.log(&quot;🎮 Nex Game Platform geladen!&quot;);
          &lt;\/script&gt;
        &lt;/body&gt;
        &lt;/html&gt;
      "></iframe>
    </body>
  </foreignObject>
</svg>
